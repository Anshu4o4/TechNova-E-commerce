<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Categories | TechNova</title>
    <link rel="stylesheet" href="./src/style.css" />

        <a href="/" class="logo">Tech<span>Nova</span></a>
        
        <div class="search-bar glass">
          <input type="text" placeholder="Search for gadgets..." />

        </div>
        
        <ul class="nav-links">
          <li><a href="/">Home</a></li>
          <li><a href="/shop.html">Shop</a></li>
          <li><a href="/categories.html" class="active">Categories</a></li>
        </ul>

        <div class="nav-icons">
          <a href="/wishlist.html" class="icon-btn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l8.78-8.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg></a>
          <a href="/cart.html" class="icon-btn cart-btn">

          </a>
          <a href="/auth.html" class="icon-btn profile-btn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></a>
        </div>
      </div>
    </nav>

    <div class="container" style="padding-top: calc(var(--header-height) + 3rem);">
      <div class="section-header">
        <h1>Product <span>Categories</span></h1>
        <p>Browse our curated collections of next-gen technology.</p>
      </div>

      <div class="category-grid grid">
        <a href="/shop.html?cat=Smartphones" class="category-card glass">
          <div class="category-icon">📱</div>
          <h3>Smartphones</h3>
          <p>Cutting-edge mobile performance</p>
        </a>
        <a href="/shop.html?cat=Laptops" class="category-card glass">
          <div class="category-icon">💻</div>
          <h3>Laptops</h3>
          <p>Power for creators and pros</p>
        </a>
        <a href="/shop.html?cat=Headphones" class="category-card glass">
          <div class="category-icon">🎧</div>
          <h3>Audio</h3>
          <p>Immersive spatial experiences</p>
        </a>
        <a href="/shop.html?cat=Smart Watches" class="category-card glass">
          <div class="category-icon">⌚</div>
          <h3>Wearables</h3>
          <p>Innovation on your wrist</p>
        </a>
      </div>

    <script type="module" src="/src/main.js"></script>
