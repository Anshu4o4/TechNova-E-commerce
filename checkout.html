<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout | TechNova</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar glass">
      <div class="container nav-container">
        <a href="/" class="logo">Tech<span>Nova</span></a>
        
        <div class="search-bar glass">
          <input type="text" placeholder="Search for gadgets..." />
          <button><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></button>
        </div>
      </div>
    </nav>

    <div class="container" style="padding-top: calc(var(--header-height) + 3rem);">
      <div class="checkout-grid">
        <!-- Forms -->
        <main class="checkout-form glass">
          <h2>Secure Checkout</h2>
          
          <div class="form-section">
            <h4>Shipping Information</h4>
            <div class="grid grid-2">
              <div class="form-group">
                <label>First Name</label>
                <input type="text" placeholder="John" />
              </div>
              <div class="form-group">
                <label>Last Name</label>
                <input type="text" placeholder="Doe" />
              </div>
            </div>
            <div class="form-group">
              <label>Address</label>
              <input type="text" placeholder="123 Future St, Tech City" />
            </div>
          </div>

          <div class="form-section">
            <h4>Payment Method</h4>
            <div class="social-auth" style="margin-bottom: 2rem;">
              <button class="social-btn active"><input type="radio" name="pay" checked /> Credit Card</button>
              <button class="social-btn"><input type="radio" name="pay" /> UPI</button>
              <button class="social-btn"><input type="radio" name="pay" /> COD</button>
            </div>
            
            <div class="form-group">
              <label>Card Number</label>
              <input type="text" placeholder="**** **** **** ****" />
            </div>
            <div class="grid grid-2">
              <div class="form-group">
                <label>Expiry Date</label>
                <input type="text" placeholder="MM/YY" />
              </div>
              <div class="form-group">
                <label>CVV</label>
                <input type="text" placeholder="***" />
              </div>
            </div>
          </div>

          <button class="btn btn-primary" style="width: 100%; height: 60px; font-size: 1.2rem;">Place Order Now</button>
        </main>

        <!-- Order Summary Side -->
        <aside class="cart-summary glass">
          <h3>Your Order</h3>
          <div class="summary-row">
            <span>Subtotal</span>
            <span>$498.00</span>
          </div>
          <div class="summary-row">
            <span>Shipping</span>
            <span>$0.00 (Free)</span>
          </div>
          <div class="summary-total">
            <span>Total</span>
            <span>$498.00</span>
          </div>
        </aside>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
