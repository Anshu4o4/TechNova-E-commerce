<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NovaWatch Pro Gen 4 | TechNova</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar glass">
      <div class="container nav-container">
        <a href="/" class="logo">Tech<span>Nova</span></a>
        
        <div class="search-bar glass">
          <input type="text" placeholder="Search for gadgets..." />
          <button><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></button>
        </div>

        <ul class="nav-links">
          <li><a href="/">Home</a></li>
          <li><a href="/shop.html">Shop</a></li>
          <li><a href="/categories.html">Categories</a></li>
          <li><a href="/deals.html">Deals</a></li>
        </ul>

        <div class="nav-icons">
          <a href="/wishlist.html" class="icon-btn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l8.78-8.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg></a>
          <a href="/cart.html" class="icon-btn cart-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
            <span class="cart-count">0</span>
          </a>
          <a href="/auth.html" class="icon-btn profile-btn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></a>
        </div>
      </div>
    </nav>

    <div class="container">
      <div class="product-details" id="product-details-container">
        <!-- Gallery -->
        <div class="product-gallery">
          <div class="main-image">
            <img src="" alt="Product Image" id="current-img" />
          </div>
          <div class="thumbnails">
            <!-- Dynamic thumbnails if needed -->
          </div>
        </div>

        <!-- Info -->
        <div class="product-info-detailed">
          <span class="badge">Checking Stock...</span>
          <h1>Loading...</h1>
          <div class="rating">☆☆☆☆☆</div>
          <p class="price">$0.00</p>
          <p class="description">Fetching product details...</p>
          
          <div class="product-meta">
            <div class="quantity-selector">
              <button class="qty-btn qty-btn-product" data-action="dec">-</button>
              <span id="qty-val">1</span>
              <button class="qty-btn qty-btn-product" data-action="inc">+</button>
            </div>
            <div class="buy-btns">
              <button class="btn btn-primary add-to-cart" id="add-to-cart-btn" style="flex: 1;">Add to Cart</button>
              <button class="btn btn-secondary buy-now" id="buy-now-btn" style="flex: 1;">Buy Now</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Specs -->
      <div class="product-specs section">
        <div class="section-header" style="text-align: left;">
          <h2>Specifications</h2>
        </div>
        <table class="specs-table glass">
          <!-- Specs injected dynamically -->
        </table>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <div class="container">
        <div class="footer-bottom">
          <p>&copy; 2026 TechNova. All rights reserved.</p>
        </div>
      </div>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
