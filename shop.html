<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop | TechNova</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar glass">
      <div class="container nav-container">
        <a href="/" class="logo">Tech<span>Nova</span></a>
        
        <div class="search-bar glass">
          <input type="text" placeholder="Search for gadgets..." />
          <button><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></button>
        </div>

        <ul class="nav-links">
          <li><a href="/">Home</a></li>
          <li><a href="/shop.html" class="active">Shop</a></li>
          <li><a href="/categories.html">Categories</a></li>
          <li><a href="/deals.html">Deals</a></li>
        </ul>

        <div class="nav-icons">
          <a href="/wishlist.html" class="icon-btn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l8.78-8.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg></a>
          <a href="/cart.html" class="icon-btn cart-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
            <span class="cart-count">0</span>
          </a>
          <a href="/auth.html" class="icon-btn profile-btn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></a>
        </div>
      </div>
    </nav>

    <div class="container shop-layout">
      <!-- Sidebar Filters -->
      <aside class="filters glass">
        <h3>Filters</h3>
        
        <div class="filter-group">
          <h4>Category</h4>
          <ul class="filter-list">
            <li><label><input type="checkbox" checked /> All Products</label></li>
            <li><label><input type="checkbox" /> Smartphones</label></li>
            <li><label><input type="checkbox" /> Laptops</label></li>
            <li><label><input type="checkbox" /> Audio</label></li>
            <li><label><input type="checkbox" /> Wearables</label></li>
          </ul>
        </div>

        <div class="filter-group">
          <h4>Price Range</h4>
          <input type="range" min="0" max="2000" value="1000" style="width: 100%; accent-color: var(--primary);" />
          <div style="display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-dim); margin-top: 0.5rem;">
            <span>$0</span>
            <span>$2000+</span>
          </div>
        </div>

        <div class="filter-group">
          <h4>Brand</h4>
          <ul class="filter-list">
            <li><label><input type="checkbox" /> Apple</label></li>
            <li><label><input type="checkbox" /> Samsung</label></li>
            <li><label><input type="checkbox" /> Sony</label></li>
            <li><label><input type="checkbox" /> TechNova</label></li>
          </ul>
        </div>
      </aside>

      <!-- Products Content -->
      <main class="shop-content">
        <header class="shop-header">
          <p>Showing 12 of 48 products</p>
          <select class="sort-select">
            <option>Default Sorting</option>
            <option>Price: Low to High</option>
            <option>Price: High to Low</option>
            <option>Popularity</option>
          </select>
        </header>

        <div class="product-grid" style="grid-template-columns: repeat(3, 1fr);">
          <!-- Products will be dynamically injected here by main.js -->
          <div class="loading">Loading our latest gadgets...</div>
        </div>
      </main>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <div class="container">
        <!-- Reusing Footer structure -->
        <div class="footer-bottom">
          <p>&copy; 2026 TechNova. All rights reserved.</p>
        </div>
      </div>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
